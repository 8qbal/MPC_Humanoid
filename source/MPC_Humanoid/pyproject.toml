[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MPC_Humanoid"
version = "0.1.0"
description = "Isaac Lab environments for MPC_Humanoid."
license = { text = "BSD-3-Clause" }
authors = [{ name = "Isaac Lab Project Developers" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[isaacsim,rsl-rl]",
]

[project.entry-points."isaaclab.tasks"]
"MPC_Humanoid" = "MPC_Humanoid.tasks"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["MPC_Humanoid", "MPC_Humanoid.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.usd", "*.yaml", "*.yml"]
