[project]
name = "MPC_Humanoid-dev"
version = "0.1.0"
description = "Development environment for the MPC_Humanoid Isaac Lab project."
requires-python = ">=3.12,<3.13"
dependencies = ["MPC_Humanoid"]

[dependency-groups]
dev = ["pre-commit"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
package = false

[tool.uv.sources]
"MPC_Humanoid" = { workspace = true }

[tool.uv.workspace]
members = ["source/MPC_Humanoid"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["MPC_Humanoid"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false
